<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Usuários - Lumina</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Usuários Cadastrados no Sistema Lumina</h1>

    <table>

        <tr>
            <th>ID Usuário</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Data de Cadastro</th>
        </tr>

        {% for usuario in usuarios %}

        <tr>
            <td>{{ usuario[0] }}</td>
            <td>{{ usuario[1] }}</td>
            <td>{{ usuario[2] }}</td>

            <td>
                {% if usuario[3] %}
                    {{ usuario[3] }}
                {% else %}
                    Não informado
                {% endif %}
            </td>

            <td>{{ usuario[4] }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/" class="btn">
        Cadastrar Novo Usuário
    </a>

</body>
</html>
