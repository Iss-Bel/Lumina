<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Lumina</title>
    <style>
        .alerta-erro {
            color: #ff0000;
            background-color: #ffe6e6;
            border: 1px solid #ffb3b3;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <h1>Cadastro Lumina</h1>

    <p> Antes de iniciar suas compras conosco faça o seu cadastro. </p>

    {% if erro %}
        <div class="alerta-erro">
            <strong>Erro:</strong> {{ erro }}
        </div>
    {% endif %}

    <form action="/salvar" method="POST">

        <!-- NOME COMPLETO -->
        <label for="nome">Nome completo:</label><br>
        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite seu nome completo"
            minlength="3"
            maxlength="100"
            pattern="[A-Za-zÀ-ÿ\s]+"
            title="Digite apenas letras e espaços."
            value="{{ valores.get('nome', '') }}"
            required
        >
        <br><br>

        <!-- EMAIL -->
        <label for="email">E-mail:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="seuemail@exemplo.com"
            maxlength="120"
            value="{{ valores.get('email', '') }}"
            required
        >
        <br><br>

        <!-- TELEFONE -->
        <label for="telefone">Telefone:</label><br>
        <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(11)4002-8922"
            maxlength="20"
            value="{{ valores.get('telefone', '') }}"
            required
        >
        <br><br>
       
        <!-- SENHA -->
        <label for="senha">Senha:</label><br>
        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            maxlength="120"
            required
        >
        <br><br>

        <button type="submit">
            Salvar Perfil
        </button>

    </form>

</body>
</html>
