<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Lumina</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="contato-container">

        <section class="contato-header">
            {% if erro %}
            <p class="alerta alerta--erro">{{ erro }}</p>
            {% endif %}

            {% if sucesso %}
            <p class="alerta alerta--sucesso">{{ sucesso }}</p>
            {% endif %}

            <h1 class="contato-titulo">Entre em contato</h1>
            <p class="contato-descricao">
                Envie sua dúvida, sugestão ou mensagem.
            </p>
        </section>

        <section class="contato-formulario">

            <!-- Ajustado o action para a rota do Flask -->
            <form class="form-contato" action="{{ url_for('contato') }}" method="POST">

                <div class="form-grupo">
                    <label class="form-label" for="nome">
                        Nome completo
                    </label>

                    <input
                        class="form-input"
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="form-grupo">
                    <label class="form-label" for="email">
                        E-mail
                    </label>

                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="form-grupo">
                    <label class="form-label" for="assunto">
                        Assunto
                    </label>

                    <input
                        class="form-input"
                        type="text"
                        id="assunto"
                        name="assunto"
                        placeholder="Digite o assunto"
                        required
                    >
                </div>

                <div class="form-grupo">
                    <label class="form-label" for="mensagem">
                        Mensagem
                    </label>

                    <textarea
                        class="form-textarea"
                        id="mensagem"
                        name="mensagem"
                        rows="5"
                        placeholder="Digite sua mensagem"
                        required
                    ></textarea>
                </div>

                <div class="form-acoes">
                    <button class="btn-enviar" type="submit">
                        Enviar mensagem
                    </button>
                </div>

            </form>

        </section>

        <footer class="contato-footer">
            <!-- Ajustado para usar a rota da página inicial -->
            <a class="link-voltar" href="{{ url_for('inicio') }}">
                Voltar para a página inicial
            </a>
        </footer>

    </main>

</body>
</html>
