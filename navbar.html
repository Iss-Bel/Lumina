<!-- Cabeçalho Principal -->
<header class="header-principal">
  <div class="header-container">
    <a href="{{ url_for('inicio') }}" class="logo-link">
      <img
        src="{{ url_for('static', filename='img/Lumina.webp') }}"
        alt="Logotipo Lumina"
        width="300"
        class="logo-flutuante"
      />
    </a>

    <!-- Menu de Navegação e Barra de Ações -->
    <nav class="nav-principal" aria-label="Navegação principal">
      <div class="nav-header-container">
        <!-- Caixa de Pesquisa -->
        <div class="search-container">
          <form
            class="search-box"
            action="{{ url_for('produtos_pagina') }}"
            method="GET"
            role="search"
          >
            <label for="search-input" class="sr-only">Buscar produtos</label>
            <input
              type="search"
              id="search-input"
              name="q"
              class="search-input"
              placeholder="Buscar produtos, marcas, tendências..."
              required
            />
            <button
              type="submit"
              class="search-button sparkle-btn"
              aria-label="Pesquisar"
            >
              <svg
                class="search-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </form>
        </div>

        <!-- Ações do Usuário -->
        <div class="user-actions">
          <a
            href="{{ url_for('provador') }}"
            class="btn-profile sparkle-btn"
            aria-label="Provador Virtual"
          >
            <svg
              class="action-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M20.38 3.46L16 2a4 4 0 0 0-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"
              ></path>
            </svg>
            <span>Provador Virtual</span>
          </a>

          <a
            href="{{ url_for('perfil') }}"
            class="btn-profile sparkle-btn"
            aria-label="Meu Perfil"
          >
            <svg
              class="action-icon user-silhouette"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
            <span>Perfil</span>
          </a>

          <a
            href="{{ url_for('consultar_pedidos') }}"
            class="btn-profile sparkle-btn"
            aria-label="Consultar Pedidos"
            title="Consultar Pedidos"
          >
            <svg
              class="action-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              ></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>Pedidos</span>
          </a>

          <a
            href="{{ url_for('carrinho') }}"
            class="btn-cart sparkle-btn"
            aria-label="Carrinho de Compras com {{ session.get('carrinho', [])|length }} itens"
          >
            <svg
              class="action-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path
                d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
              ></path>
            </svg>
            <span class="cart-count"
              >{{ session.get('carrinho', [])|length }}</span
            >
          </a>
        </div>
      </div>
    </nav>
  </div>
</header>

<!-- Categorias do Menu Centralizadas -->
<nav
  class="nav-categorias"
  aria-label="Categorias de produtos"
  style="
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  "
>
  <a
    href="{{ url_for('produtos_pagina', categoria='ofertas') }}"
    class="btn-category sparkle-btn"
    >OFERTAS</a
  >
  <a
    href="{{ url_for('produtos_pagina', categoria='trending') }}"
    class="btn-category sparkle-btn"
    >TRENDING</a
  >
  <a
    href="{{ url_for('produtos_pagina', categoria='esportivo') }}"
    class="btn-category sparkle-btn"
    >ESPORTIVO</a
  >
  <a
    href="{{ url_for('produtos_pagina', categoria='feminino') }}"
    class="btn-category sparkle-btn"
    >FEMININO</a
  >
  <a
    href="{{ url_for('produtos_pagina', categoria='infantil') }}"
    class="btn-category sparkle-btn"
    >MODA INFANTIL</a
  >
  <a
    href="{{ url_for('produtos_pagina', categoria='novidades') }}"
    class="btn-category sparkle-btn"
    >NOVIDADES</a
  >
</nav>
